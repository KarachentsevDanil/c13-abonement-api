name: ci
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --project unit --coverage --coverage.reportsDirectory=coverage/unit
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info

  # Testcontainers: Docker на ubuntu-latest уже є
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Гард 2 (theory-2): кожна функція репозиторіїв src/store виконана інтеграційним тестом.
      # Лише *.repo.ts: колбек .references(() => readers.id) у schema.ts під час запитів не викликається,
      # тож --coverage.include='src/store/**' не дає 100 % функцій навіть без змін.
      - run: >-
          npx vitest run --project integration --coverage
          --coverage.reportsDirectory=coverage/integration
          --coverage.include='src/store/*.repo.ts' --coverage.thresholds.functions=100
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage/integration/lcov.info

  # Мутаційне тестування з порогом break (stryker.config.json): оцінка нижча за 80 → exit 1
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx stryker run

  # Quality gate Sonar way налаштовано на сервері; статус — окрема обов'язкова перевірка
  sonar:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage-unit
          path: coverage/unit
      - uses: actions/download-artifact@v8
        with:
          name: coverage-integration
          path: coverage/integration
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
